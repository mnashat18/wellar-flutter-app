org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
android.useAndroidX=true
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.workers.max=2

# Kotlin compiler stability on low/medium RAM machines
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx1024m,-Xms256m,-XX:-UseParallelGC
